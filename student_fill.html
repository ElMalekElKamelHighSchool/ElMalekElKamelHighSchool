<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل البيانات</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 font-sans">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 id="formTitle" class="text-3xl font-bold mb-6 text-center">جاري التحميل...</h1>
        <form id="dynamicForm" onsubmit="submitForm(event)" class="space-y-4"></form>
        
        <div id="successMessage" class="hidden mt-6 p-6 bg-green-100 border border-green-400 rounded text-center">
            <h2 class="text-2xl font-bold text-green-700 mb-2">تم التسليم بنجاح!</h2>
            <p>رقمك التسلسلي: <span id="serialNumSpan" class="font-bold text-xl"></span></p>
            <p>الكود المميز للتعديل: <span id="uniqueIdSpan" class="font-bold text-xl text-red-600"></span></p>
            <p class="text-sm text-gray-600 mt-2">يرجى الاحتفاظ بهذا الكود إذا احتجت لتعديل بياناتك لاحقاً.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { /* الكونفيج */ 
            apiKey: "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4", authDomain: "hazoma-60ed2.firebaseapp.com", projectId: "hazoma-60ed2", storageBucket: "hazoma-60ed2.firebasestorage.app", messagingSenderId: "962438384604", appId: "1:962438384604:web:52db16e5723a8f6d3bdd19"
        };
        const db = getFirestore(initializeApp(firebaseConfig));
        const urlParams = new URLSearchParams(window.location.search);
        const formId = urlParams.get('formId');
        let questions = [];

        async function loadForm() {
            const formDoc = await getDoc(doc(db, "forms", formId));
            if(!formDoc.exists()) return alert("الفورم غير موجود");
            
            document.getElementById('formTitle').innerText = formDoc.data().title;
            questions = formDoc.data().questions;
            
            let html = '';
            questions.forEach(q => {
                let display = q.conditionId ? 'none' : 'block';
                let req = q.required ? 'required' : '';
                let extraAttr = q.title.includes("القومي") ? 'pattern="\\d{14}" title="يجب أن يكون 14 رقم"' : '';
                
                html += `<div id="div_${q.id}" style="display:${display}" class="p-3 border rounded bg-gray-50">
                    <label class="block font-bold mb-2">${q.title} ${q.required ? '<span class="text-red-500">*</span>' : ''}</label>`;
                
                if(q.type === 'select') {
                    html += `<select id="${q.id}" ${req} onchange="checkConditions('${q.id}')" class="w-full p-2 border rounded">
                        <option value="">اختر...</option>
                        ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                    </select>`;
                } else {
                    html += `<input type="${q.type}" id="${q.id}" ${req} ${extraAttr} class="w-full p-2 border rounded" onkeyup="checkConditions('${q.id}')">`;
                }
                html += `</div>`;
            });
            html += `<button type="submit" class="w-full bg-blue-600 text-white p-3 rounded font-bold">تسليم البيانات</button>`;
            document.getElementById('dynamicForm').innerHTML = html;
        }

        window.checkConditions = function(changedQId) {
            let val = document.getElementById(changedQId).value;
            questions.forEach(q => {
                if(q.conditionId === changedQId) {
                    let targetDiv = document.getElementById('div_' + q.id);
                    if(val === q.conditionValue) {
                        targetDiv.style.display = 'block';
                        document.getElementById(q.id).setAttribute('required', 'true');
                    } else {
                        targetDiv.style.display = 'none';
                        document.getElementById(q.id).removeAttribute('required');
                        document.getElementById(q.id).value = '';
                    }
                }
            });
        }

        window.submitForm = async function(e) {
            e.preventDefault();
            let answers = {};
            let hasError = false;

            for(let q of questions) {
                let el = document.getElementById(q.id);
                if(document.getElementById('div_'+q.id).style.display !== 'none') {
                    answers[q.id] = el.value;
                    // تحقق من منع التكرار
                    if(q.unique && el.value) {
                        const dupCheck = await getDocs(query(collection(db, "submissions"), where(`answers.${q.id}`, "==", el.value), where("formId", "==", formId)));
                        if(!dupCheck.empty) {
                            alert(`البيانات المدخلة في "${q.title}" مسجلة مسبقاً! يمنع التكرار.`);
                            hasError = true;
                        }
                    }
                }
            }
            if(hasError) return;

            // توليد أكواد
            const countSnap = await getDocs(query(collection(db, "submissions"), where("formId", "==", formId)));
            let serialNum = countSnap.size + 1;
            let uniqueId = Math.random().toString(36).substring(2, 8).toUpperCase();

            await addDoc(collection(db, "submissions"), {
                formId: formId,
                serialNumber: serialNum,
                uniqueId: uniqueId,
                answers: answers,
                timestamp: new Date()
            });

            document.getElementById('dynamicForm').style.display = 'none';
            document.getElementById('successMessage').classList.remove('hidden');
            document.getElementById('serialNumSpan').innerText = serialNum;
            document.getElementById('uniqueIdSpan').innerText = uniqueId;
        }

        if(formId) loadForm();
    </script>
</body>
</html>
