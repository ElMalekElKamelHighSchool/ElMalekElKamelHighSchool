<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>أدمن - إنشاء وإدارة الفورم</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        body {
            font-family: Arial, Tahoma, sans-serif;
        }

        .question-card {
            transition: all .2s ease;
        }

        .question-card:hover {
            transform: translateY(-1px);
        }

        .option-item {
            transition: .15s;
        }

        .dependent-box {
            border-right: 4px solid #7c3aed;
        }

        .parent-map-box {
            border-right: 4px solid #2563eb;
        }

        .edit-mode {
            border: 2px solid #f59e0b;
            background: #fffbeb;
        }

    </style>

</head>


<body class="bg-gray-100 p-3 md:p-8">


<div class="max-w-5xl mx-auto bg-white p-5 md:p-8 rounded-2xl shadow-md">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="flex flex-col md:flex-row justify-between gap-4 items-center mb-6 border-b pb-5">

        <h1
            id="pageTitle"
            class="text-2xl md:text-3xl font-bold text-blue-600"
        >
            منشئ النماذج
        </h1>


        <a
            id="backManageBtn"
            href="#"
            class="hidden bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold"
        >
            ↩️ الرجوع لإدارة الفورم
        </a>

    </div>



    <!-- =====================================================
         FORM TITLE
    ====================================================== -->

    <input
        type="text"
        id="formTitle"
        placeholder="اسم الفورم (مثال: بيانات طلاب الصف الأول)"
        class="w-full p-3 border rounded-lg mb-6 text-lg outline-none focus:ring-2 focus:ring-blue-400"
    >



    <!-- =====================================================
         QUESTIONS
    ====================================================== -->

    <div
        id="questionsContainer"
        class="space-y-4 mb-6"
    ></div>



    <!-- =====================================================
         QUESTION EDITOR
    ====================================================== -->

    <div
        id="questionEditor"
        class="bg-blue-50 p-4 md:p-5 rounded-xl border border-blue-200 mb-6"
    >

        <div class="flex justify-between items-center mb-4">

            <h3
                id="questionEditorTitle"
                class="font-bold text-lg text-blue-800"
            >
                إضافة حقل جديد
            </h3>


            <button
                id="cancelEditBtn"
                onclick="cancelEdit()"
                class="hidden bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded-lg"
            >
                إلغاء التعديل
            </button>

        </div>



        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">


            <!-- TITLE -->

            <div>

                <label class="block mb-1 font-bold text-sm">
                    عنوان السؤال
                </label>

                <input
                    type="text"
                    id="qTitle"
                    placeholder="عنوان السؤال"
                    class="w-full p-3 border rounded-lg"
                >

            </div>



            <!-- TYPE -->

            <div>

                <label class="block mb-1 font-bold text-sm">
                    نوع السؤال
                </label>

                <select
                    id="qType"
                    onchange="toggleOptionsUI()"
                    class="w-full p-3 border rounded-lg"
                >

                    <option value="text">
                        نص عادي
                    </option>

                    <option value="number">
                        رقم
                    </option>

                    <option value="tel">
                        رقم هاتف
                    </option>

                    <option value="date">
                        تاريخ
                    </option>

                    <option value="select">
                        قائمة منسدلة ListBox
                    </option>

                </select>

            </div>



            <!-- OPTIONS -->

            <div
                id="optionsDiv"
                class="md:col-span-2 hidden bg-white p-4 border rounded-xl"
            >

                <h3 class="font-bold text-purple-700 mb-3">
                    خيارات القائمة
                </h3>


                <div class="flex gap-2 mb-3">

                    <input
                        type="text"
                        id="newOptionText"
                        placeholder="اكتب الخيار"
                        class="p-3 border rounded-lg flex-1"
                        onkeydown="handleOptionEnter(event)"
                    >


                    <button
                        onclick="addOptionToList()"
                        class="bg-green-600 hover:bg-green-700 text-white px-5 rounded-lg font-bold"
                    >
                        + إضافة
                    </button>

                </div>


                <div
                    id="optionsList"
                    class="space-y-2"
                ></div>


                <div
                    id="noOptionsMessage"
                    class="text-center text-gray-400 py-4"
                >
                    لا توجد خيارات حتى الآن
                </div>



                <!-- DEPENDENCY -->

                <div class="border-t mt-5 pt-5">

                    <label class="flex items-center gap-2 font-bold">

                        <input
                            type="checkbox"
                            id="qIsDependent"
                            onchange="toggleDependentUI()"
                            class="w-5 h-5"
                        >

                        هذه القائمة تعتمد على ListBox آخر

                    </label>



                    <div
                        id="dependentUI"
                        class="hidden mt-4 dependent-box bg-purple-50 p-4 rounded-lg"
                    >

                        <label class="block font-bold mb-2">
                            السؤال الأب
                        </label>


                        <select
                            id="qDependsOn"
                            onchange="renderParentMappings()"
                            class="w-full p-3 border rounded-lg bg-white"
                        >

                            <option value="">
                                اختر السؤال الأب
                            </option>

                        </select>


                        <div
                            id="parentMappingsBox"
                            class="hidden parent-map-box bg-white mt-4 p-4 rounded-lg"
                        >

                            <h4 class="font-bold text-blue-700 mb-2">
                                ربط الخيارات
                            </h4>

                            <p class="text-xs text-gray-500 mb-4">
                                حدد الخيارات التي تظهر لكل إجابة من السؤال الأب.
                            </p>


                            <div
                                id="parentMappings"
                                class="space-y-4"
                            ></div>

                        </div>

                    </div>

                </div>

            </div>



            <!-- REQUIRED / UNIQUE -->

            <div class="md:col-span-2 flex flex-wrap gap-6">

                <label class="flex items-center gap-2">

                    <input
                        type="checkbox"
                        id="qRequired"
                        class="w-5 h-5"
                    >

                    إجباري

                </label>


                <label class="flex items-center gap-2">

                    <input
                        type="checkbox"
                        id="qUnique"
                        class="w-5 h-5"
                    >

                    يمنع التكرار

                </label>

            </div>



            <!-- CONDITION -->

            <div class="md:col-span-2 border-t pt-4">

                <label class="font-bold text-sm block mb-2">
                    شرط الظهور
                </label>


                <select
                    id="qConditionId"
                    class="w-full p-3 border rounded-lg mb-2"
                >

                    <option value="">
                        يظهر دائماً
                    </option>

                </select>


                <input
                    type="text"
                    id="qConditionValue"
                    placeholder="يظهر إذا كانت الإجابة تساوي..."
                    class="w-full p-3 border rounded-lg"
                >

            </div>

        </div>



        <button
            id="addQuestionBtn"
            onclick="addQuestion()"
            class="mt-5 w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-bold text-lg"
        >
            إضافة السؤال للفورم
        </button>

    </div>



    <!-- =====================================================
         SAVE FORM
    ====================================================== -->

    <button
        id="saveFormButton"
        onclick="saveForm()"
        class="w-full bg-green-600 hover:bg-green-700 text-white p-4 rounded-lg font-bold text-lg"
    >
        💾 حفظ الفورم بالكامل
    </button>



    <!-- =====================================================
         EXISTING FORMS
    ====================================================== -->

    <h2 class="text-2xl font-bold mt-10 mb-4 border-b pb-2">
        الفورمات المتاحة
    </h2>


    <ul
        id="formsList"
        class="space-y-3"
    ></ul>

</div>



<script type="module">


// ============================================================
// FIREBASE
// ============================================================

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4",

    authDomain:
        "hazoma-60ed2.firebaseapp.com",

    projectId:
        "hazoma-60ed2",

    storageBucket:
        "hazoma-60ed2.firebasestorage.app",

    messagingSenderId:
        "962438384604",

    appId:
        "1:962438384604:web:52db16e5723a8f6d3bdd19"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);



// ============================================================
// URL
// ============================================================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const editFormId =
    urlParams.get("formId");



// ============================================================
// VARIABLES
// ============================================================

let questions = [];

let tempOptions = [];

let editingQuestionIndex = -1;



// ============================================================
// ESCAPE
// ============================================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



// ============================================================
// TYPE NAME
// ============================================================

function getTypeName(type) {

    const names = {

        text: "نص",

        number: "رقم",

        tel: "هاتف",

        date: "تاريخ",

        select: "ListBox"

    };

    return names[type] || type;

}



// ============================================================
// TOGGLE OPTIONS
// ============================================================

window.toggleOptionsUI = function() {

    const type =
        document.getElementById(
            "qType"
        ).value;


    const div =
        document.getElementById(
            "optionsDiv"
        );


    if (type === "select") {

        div.classList.remove("hidden");

        populateParentSelect();

    }
    else {

        div.classList.add("hidden");

        document.getElementById(
            "qIsDependent"
        ).checked = false;

        toggleDependentUI();

    }

};



// ============================================================
// ENTER OPTION
// ============================================================

window.handleOptionEnter = function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        addOptionToList();

    }

};



// ============================================================
// ADD OPTION
// ============================================================

window.addOptionToList = function() {

    const input =
        document.getElementById(
            "newOptionText"
        );


    const value =
        input.value.trim();


    if (!value) {

        return;

    }


    if (
        tempOptions.some(
            o => o.text === value
        )
    ) {

        alert("الخيار موجود بالفعل");

        return;

    }


    tempOptions.push({

        id:
            "opt_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 8),

        text:
            value

    });


    input.value = "";

    renderTempOptions();

    renderParentMappings();

};



// ============================================================
// RENDER OPTIONS
// ============================================================

function renderTempOptions() {

    const list =
        document.getElementById(
            "optionsList"
        );


    const empty =
        document.getElementById(
            "noOptionsMessage"
        );


    if (
        tempOptions.length === 0
    ) {

        list.innerHTML = "";

        empty.classList.remove("hidden");

        return;

    }


    empty.classList.add("hidden");


    list.innerHTML =
        tempOptions.map(
            (option, index) => `

            <div
                class="option-item bg-gray-50 border rounded-lg p-2 flex items-center gap-2"
            >

                <span class="text-gray-400">
                    ☰
                </span>

                <span
                    class="bg-blue-100 text-blue-700 rounded-full w-7 h-7 flex items-center justify-center font-bold"
                >
                    ${index + 1}
                </span>

                <input
                    type="text"
                    value="${escapeHTML(option.text)}"
                    onchange="updateOptionText(${index}, this.value)"
                    class="flex-1 p-2 border rounded bg-white"
                >

                <button
                    onclick="moveOption(${index}, -1)"
                    class="bg-gray-200 px-3 py-2 rounded"
                >
                    ↑
                </button>

                <button
                    onclick="moveOption(${index}, 1)"
                    class="bg-gray-200 px-3 py-2 rounded"
                >
                    ↓
                </button>

                <button
                    onclick="deleteOption(${index})"
                    class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded"
                >
                    حذف
                </button>

            </div>

        `
        ).join("");

}



// ============================================================
// UPDATE OPTION
// ============================================================

window.updateOptionText = function(
    index,
    value
) {

    value = value.trim();


    if (!value) {

        alert("الخيار لا يمكن أن يكون فارغاً");

        renderTempOptions();

        return;

    }


    if (
        tempOptions.some(
            (o, i) =>
                i !== index &&
                o.text === value
        )
    ) {

        alert("الخيار موجود بالفعل");

        renderTempOptions();

        return;

    }


    tempOptions[index].text = value;

    renderParentMappings();

};



// ============================================================
// DELETE OPTION
// ============================================================

window.deleteOption = function(index) {

    if (!confirm("هل تريد حذف هذا الخيار؟")) {

        return;

    }


    tempOptions.splice(
        index,
        1
    );


    renderTempOptions();

    renderParentMappings();

};



// ============================================================
// MOVE OPTION
// ============================================================

window.moveOption = function(
    index,
    direction
) {

    const newIndex =
        index + direction;


    if (
        newIndex < 0 ||
        newIndex >= tempOptions.length
    ) {

        return;

    }


    const temp =
        tempOptions[index];


    tempOptions[index] =
        tempOptions[newIndex];


    tempOptions[newIndex] =
        temp;


    renderTempOptions();

    renderParentMappings();

};



// ============================================================
// DEPENDENCY UI
// ============================================================

window.toggleDependentUI = function() {

    const checked =
        document.getElementById(
            "qIsDependent"
        ).checked;


    const box =
        document.getElementById(
            "dependentUI"
        );


    if (checked) {

        box.classList.remove("hidden");

        populateParentSelect();

        renderParentMappings();

    }
    else {

        box.classList.add("hidden");

        document.getElementById(
            "parentMappingsBox"
        ).classList.add("hidden");

    }

};



// ============================================================
// POPULATE PARENT
// ============================================================

function populateParentSelect() {

    const select =
        document.getElementById(
            "qDependsOn"
        );


    const oldValue =
        select.value;


    select.innerHTML = `
        <option value="">
            اختر السؤال الأب
        </option>
    `;


    questions.forEach(
        (q, index) => {

            if (
                index === editingQuestionIndex
            ) {

                return;

            }


            if (
                q.type === "select"
            ) {

                select.innerHTML += `
                    <option value="${escapeHTML(q.id)}">
                        ${escapeHTML(q.title)}
                    </option>
                `;

            }

        }
    );


    if (
        oldValue &&
        [...select.options].some(
            o => o.value === oldValue
        )
    ) {

        select.value = oldValue;

    }

}



// ============================================================
// PARENT MAPPINGS
// ============================================================

window.renderParentMappings = function() {

    const parentId =
        document.getElementById(
            "qDependsOn"
        ).value;


    const box =
        document.getElementById(
            "parentMappingsBox"
        );


    const container =
        document.getElementById(
            "parentMappings"
        );


    if (!parentId) {

        box.classList.add("hidden");

        container.innerHTML = "";

        return;

    }


    const parent =
        questions.find(
            q => q.id === parentId
        );


    if (
        !parent ||
        parent.type !== "select"
    ) {

        box.classList.add("hidden");

        return;

    }


    box.classList.remove("hidden");


    let oldMappings = {};


    if (
        editingQuestionIndex >= 0
    ) {

        const currentQ =
            questions[
                editingQuestionIndex
            ];


        if (
            currentQ.dependentOn &&
            currentQ.dependentOn.mappings
        ) {

            oldMappings =
                currentQ.dependentOn.mappings;

        }

    }


    container.innerHTML =
        (parent.options || [])
        .map(
            parentOption => {

                const selected =
                    oldMappings[
                        parentOption.text
                    ] || [];


                return `

                <div
                    class="border rounded-xl p-4 bg-gray-50"
                >

                    <div class="font-bold text-blue-700 mb-3">

                        عندما تكون الإجابة:

                        <span class="text-purple-700">
                            ${escapeHTML(parentOption.text)}
                        </span>

                    </div>


                    <div
                        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2"
                    >

                        ${
                            tempOptions.length

                            ?

                            tempOptions.map(
                                child => {

                                    const checked =
                                        selected.includes(
                                            child.text
                                        );


                                    return `

                                    <label
                                        class="flex items-center gap-2 bg-white border rounded-lg p-2 cursor-pointer"
                                    >

                                        <input
                                            type="checkbox"
                                            class="dependent-option-checkbox w-4 h-4"
                                            data-parent="${escapeHTML(parentOption.text)}"
                                            value="${escapeHTML(child.text)}"
                                            ${checked ? "checked" : ""}
                                        >

                                        <span>
                                            ${escapeHTML(child.text)}
                                        </span>

                                    </label>

                                    `;

                                }
                            ).join("")

                            :

                            `
                            <div class="col-span-full text-gray-400">
                                أضف خيارات القائمة أولاً.
                            </div>
                            `
                        }

                    </div>

                </div>

                `;

            }
        )
        .join("");

};



// ============================================================
// COLLECT MAPPINGS
// ============================================================

function collectMappings() {

    const mappings = {};


    document
        .querySelectorAll(
            ".dependent-option-checkbox"
        )
        .forEach(
            checkbox => {

                const parent =
                    checkbox.dataset.parent;


                if (
                    !mappings[parent]
                ) {

                    mappings[parent] = [];

                }


                if (
                    checkbox.checked
                ) {

                    mappings[parent].push(
                        checkbox.value
                    );

                }

            }
        );


    return mappings;

}



// ============================================================
// ADD / UPDATE QUESTION
// ============================================================

window.addQuestion = function() {

    const title =
        document.getElementById(
            "qTitle"
        ).value.trim();


    if (!title) {

        alert("أدخل عنوان السؤال");

        return;

    }


    const type =
        document.getElementById(
            "qType"
        ).value;


    if (
        type === "select" &&
        tempOptions.length === 0
    ) {

        alert(
            "أضف خياراً واحداً على الأقل"
        );

        return;

    }


    let dependentOn = null;


    if (
        type === "select" &&
        document.getElementById(
            "qIsDependent"
        ).checked
    ) {

        const parentId =
            document.getElementById(
                "qDependsOn"
            ).value;


        if (!parentId) {

            alert("اختر السؤال الأب");

            return;

        }


        dependentOn = {

            questionId:
                parentId,

            mappings:
                collectMappings()

        };

    }


    const q = {

        id:
            editingQuestionIndex >= 0

            ?

            questions[
                editingQuestionIndex
            ].id

            :

            "q_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 8),

        title:
            title,

        type:
            type,

        required:
            document.getElementById(
                "qRequired"
            ).checked,

        unique:
            document.getElementById(
                "qUnique"
            ).checked,

        options:
            type === "select"
            ?
            tempOptions.map(
                o => ({
                    id: o.id,
                    text: o.text
                })
            )
            :
            [],

        conditionId:
            document.getElementById(
                "qConditionId"
            ).value,

        conditionValue:
            document.getElementById(
                "qConditionValue"
            ).value.trim()

    };


    if (dependentOn) {

        q.dependentOn =
            dependentOn;

    }


    if (
        editingQuestionIndex >= 0
    ) {

        questions[
            editingQuestionIndex
        ] = q;

    }
    else {

        questions.push(q);

    }


    editingQuestionIndex = -1;


    clearQuestionEditor();

    updateQuestionsUI();

    updateConditionSelects();

};



// ============================================================
// QUESTIONS UI
// ============================================================

function updateQuestionsUI() {

    let html = "";


    questions.forEach(
        (q, index) => {

            let dependency = "";


            if (q.dependentOn) {

                const parent =
                    questions.find(
                        p =>
                            p.id ===
                            q.dependentOn.questionId
                    );


                if (parent) {

                    dependency = `
                        <div class="mt-2 text-xs bg-purple-50 text-purple-700 p-2 rounded">
                            🔗 تابع لـ:
                            <strong>
                                ${escapeHTML(parent.title)}
                            </strong>
                        </div>
                    `;

                }

            }


            let options = "";


            if (q.type === "select") {

                options = `
                    <div class="text-xs text-gray-500 mt-2">
                        الخيارات:
                        ${
                            (q.options || [])
                            .map(
                                o =>
                                    escapeHTML(o.text)
                            )
                            .join(" ← ")
                        }
                    </div>
                `;

            }


            html += `

            <div
                class="question-card border rounded-xl p-4 bg-gray-50"
            >

                <div class="flex flex-col md:flex-row justify-between gap-4">

                    <div class="flex-1">

                        <div class="flex flex-wrap items-center gap-2">

                            <span
                                class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold"
                            >
                                ${index + 1}
                            </span>


                            <span class="font-bold text-lg">
                                ${escapeHTML(q.title)}
                            </span>


                            <span class="text-xs bg-gray-200 px-2 py-1 rounded">
                                ${getTypeName(q.type)}
                            </span>


                            ${
                                q.required
                                ?
                                `
                                <span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded">
                                    إجباري
                                </span>
                                `
                                :
                                ""
                            }


                            ${
                                q.unique
                                ?
                                `
                                <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded">
                                    يمنع التكرار
                                </span>
                                `
                                :
                                ""
                            }

                        </div>


                        ${options}


                        ${dependency}

                    </div>


                    <div class="flex flex-wrap gap-2 items-start">

                        <button
                            onclick="moveQ(${index}, -1)"
                            class="bg-gray-300 hover:bg-gray-400 px-3 py-2 rounded-lg"
                        >
                            ↑
                        </button>


                        <button
                            onclick="moveQ(${index}, 1)"
                            class="bg-gray-300 hover:bg-gray-400 px-3 py-2 rounded-lg"
                        >
                            ↓
                        </button>


                        <button
                            onclick="editQuestion(${index})"
                            class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded-lg"
                        >
                            ✏️ تعديل
                        </button>


                        <button
                            onclick="deleteQ(${index})"
                            class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg"
                        >
                            🗑 حذف
                        </button>

                    </div>

                </div>

            </div>

            `;

        }
    );


    document.getElementById(
        "questionsContainer"
    ).innerHTML = html;

}



// ============================================================
// EDIT QUESTION
// ============================================================

window.editQuestion = function(index) {

    const q =
        questions[index];


    if (!q) {

        return;

    }


    editingQuestionIndex =
        index;


    document.getElementById(
        "questionEditorTitle"
    ).innerText =
        "✏️ تعديل السؤال";


    document.getElementById(
        "addQuestionBtn"
    ).innerText =
        "💾 حفظ تعديل السؤال";


    document.getElementById(
        "cancelEditBtn"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "qTitle"
    ).value =
        q.title || "";


    document.getElementById(
        "qType"
    ).value =
        q.type || "text";


    document.getElementById(
        "qRequired"
    ).checked =
        !!q.required;


    document.getElementById(
        "qUnique"
    ).checked =
        !!q.unique;


    document.getElementById(
        "qConditionId"
    ).value =
        q.conditionId || "";


    document.getElementById(
        "qConditionValue"
    ).value =
        q.conditionValue || "";


    tempOptions =
        (q.options || [])
        .map(
            option => {

                if (
                    typeof option === "string"
                ) {

                    return {

                        id:
                            "opt_" +
                            Date.now() +
                            Math.random(),

                        text:
                            option

                    };

                }


                return {

                    id:
                        option.id ||
                        "opt_" +
                        Date.now() +
                        Math.random(),

                    text:
                        option.text || ""

                };

            }
        );


    document.getElementById(
        "qIsDependent"
    ).checked =
        !!q.dependentOn;


    toggleOptionsUI();

    populateParentSelect();


    if (q.dependentOn) {

        document.getElementById(
            "qDependsOn"
        ).value =
            q.dependentOn.questionId || "";

    }


    toggleDependentUI();

    renderTempOptions();

    renderParentMappings();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

};



// ============================================================
// CANCEL EDIT
// ============================================================

window.cancelEdit = function() {

    editingQuestionIndex = -1;

    clearQuestionEditor();

};



// ============================================================
// CLEAR EDITOR
// ============================================================

function clearQuestionEditor() {

    document.getElementById(
        "questionEditorTitle"
    ).innerText =
        "إضافة حقل جديد";


    document.getElementById(
        "addQuestionBtn"
    ).innerText =
        "إضافة السؤال للفورم";


    document.getElementById(
        "cancelEditBtn"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "qTitle"
    ).value = "";


    document.getElementById(
        "qType"
    ).value =
        "text";


    document.getElementById(
        "qRequired"
    ).checked =
        false;


    document.getElementById(
        "qUnique"
    ).checked =
        false;


    document.getElementById(
        "qConditionId"
    ).value =
        "";


    document.getElementById(
        "qConditionValue"
    ).value =
        "";


    document.getElementById(
        "qIsDependent"
    ).checked =
        false;


    document.getElementById(
        "qDependsOn"
    ).innerHTML = `
        <option value="">
            اختر السؤال الأب
        </option>
    `;


    tempOptions = [];


    renderTempOptions();


    document.getElementById(
        "optionsDiv"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "dependentUI"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "parentMappingsBox"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "parentMappings"
    ).innerHTML = "";

}



// ============================================================
// MOVE QUESTION
// ============================================================

window.moveQ = function(
    index,
    direction
) {

    const newIndex =
        index + direction;


    if (
        newIndex < 0 ||
        newIndex >= questions.length
    ) {

        return;

    }


    const temp =
        questions[index];


    questions[index] =
        questions[newIndex];


    questions[newIndex] =
        temp;


    updateQuestionsUI();

    updateConditionSelects();

};



// ============================================================
// DELETE QUESTION
// ============================================================

window.deleteQ = function(index) {

    const q =
        questions[index];


    if (!q) {

        return;

    }


    if (
        !confirm(
            `هل تريد حذف السؤال "${q.title}"؟`
        )
    ) {

        return;

    }


    questions
        .filter(
            child =>
                child.dependentOn &&
                child.dependentOn.questionId === q.id
        )
        .forEach(
            child => {

                delete child.dependentOn;

            }
        );


    questions.splice(
        index,
        1
    );


    editingQuestionIndex = -1;


    clearQuestionEditor();

    updateQuestionsUI();

    updateConditionSelects();

};



// ============================================================
// CONDITIONS
// ============================================================

function updateConditionSelects() {

    const select =
        document.getElementById(
            "qConditionId"
        );


    const oldValue =
        select.value;


    select.innerHTML = `
        <option value="">
            يظهر دائماً
        </option>
    `;


    questions.forEach(
        (q, index) => {

            if (
                index === editingQuestionIndex
            ) {

                return;

            }


            if (
                q.type === "select"
            ) {

                select.innerHTML += `
                    <option value="${escapeHTML(q.id)}">
                        ${escapeHTML(q.title)}
                    </option>
                `;

            }

        }
    );


    if (
        oldValue &&
        [...select.options].some(
            o => o.value === oldValue
        )
    ) {

        select.value =
            oldValue;

    }

}



// ============================================================
// CLEAN QUESTIONS
// ============================================================

function getCleanQuestions() {

    return questions.map(
        q => {

            const clean = {

                id:
                    q.id,

                title:
                    q.title,

                type:
                    q.type,

                required:
                    !!q.required,

                unique:
                    !!q.unique,

                options:
                    Array.isArray(q.options)
                    ?
                    q.options.map(
                        o => ({

                            id:
                                o.id,

                            text:
                                o.text

                        })
                    )
                    :
                    [],

                conditionId:
                    q.conditionId || "",

                conditionValue:
                    q.conditionValue || ""

            };


            if (
                q.dependentOn
            ) {

                clean.dependentOn = {

                    questionId:
                        q.dependentOn.questionId,

                    mappings:
                        q.dependentOn.mappings || {}

                };

            }


            return clean;

        }
    );

}



// ============================================================
// SAVE FORM
// ============================================================

window.saveForm = async function() {

    const title =
        document.getElementById(
            "formTitle"
        ).value.trim();


    if (
        !title ||
        questions.length === 0
    ) {

        alert(
            "أدخل اسم الفورم وأضف الأسئلة"
        );

        return;

    }


    try {

        const cleanQuestions =
            getCleanQuestions();


        // =========================================
        // EDIT EXISTING
        // =========================================

        if (editFormId) {

            await updateDoc(

                doc(
                    db,
                    "forms",
                    editFormId
                ),

                {

                    title:
                        title,

                    questions:
                        cleanQuestions,

                    updatedAt:
                        serverTimestamp()

                }

            );


            alert(
                "تم تعديل الفورم بنجاح ✅"
            );


            window.location.href =
                "admin_manage.html?formId=" +
                encodeURIComponent(
                    editFormId
                );


            return;

        }


        // =========================================
        // CREATE NEW
        // =========================================

        await addDoc(

            collection(
                db,
                "forms"
            ),

            {

                title:
                    title,

                questions:
                    cleanQuestions,

                allowEdit:
                    true,

                createdAt:
                    serverTimestamp()

            }

        );


        alert(
            "تم إنشاء الفورم بنجاح ✅"
        );


        location.reload();

    }
    catch(error) {

        console.error(error);

        alert(
            "حدث خطأ: " +
            error.message
        );

    }

};



// ============================================================
// LOAD FORM FOR EDIT
// ============================================================

async function loadFormForEdit() {

    if (!editFormId) {

        return;

    }


    try {

        const formSnap =
            await getDoc(
                doc(
                    db,
                    "forms",
                    editFormId
                )
            );


        if (!formSnap.exists()) {

            alert(
                "الفورم غير موجود"
            );

            return;

        }


        const data =
            formSnap.data();


        document.getElementById(
            "formTitle"
        ).value =
            data.title || "";


        questions =
            Array.isArray(
                data.questions
            )
            ?
            data.questions.map(
                q => ({

                    ...q,

                    options:
                        Array.isArray(q.options)
                        ?
                        q.options.map(
                            option => {

                                if (
                                    typeof option === "string"
                                ) {

                                    return {

                                        id:
                                            "opt_" +
                                            Date.now() +
                                            Math.random(),

                                        text:
                                            option

                                    };

                                }


                                return {

                                    id:
                                        option.id ||
                                        "opt_" +
                                        Date.now() +
                                        Math.random(),

                                    text:
                                        option.text || ""

                                };

                            }
                        )
                        :
                        []

                })
            )
            :
            [];


        document.getElementById(
            "pageTitle"
        ).innerText =
            "✏️ تعديل الفورم";


        document.getElementById(
            "saveFormButton"
        ).innerText =
            "💾 حفظ تعديلات الفورم";


        document.getElementById(
            "backManageBtn"
        ).href =
            "admin_manage.html?formId=" +
            encodeURIComponent(
                editFormId
            );


        document.getElementById(
            "backManageBtn"
        ).classList.remove(
            "hidden"
        );


        updateQuestionsUI();

        updateConditionSelects();

    }
    catch(error) {

        console.error(error);

        alert(
            "تعذر تحميل الفورم: " +
            error.message
        );

    }

}



// ============================================================
// LOAD FORMS
// ============================================================

async function loadForms() {

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "forms"
                )
            );


        let html = "";


        snapshot.forEach(
            snap => {

                const data =
                    snap.data();


                html += `

                <li
                    class="p-4 bg-white border rounded-xl shadow-sm flex flex-col md:flex-row justify-between gap-3"
                >

                    <div>

                        <div class="font-bold text-lg">
                            ${escapeHTML(
                                data.title ||
                                "فورم بدون اسم"
                            )}
                        </div>


                        <div class="text-xs text-gray-500">
                            عدد الأسئلة:
                            ${
                                Array.isArray(
                                    data.questions
                                )
                                ?
                                data.questions.length
                                :
                                0
                            }
                        </div>

                    </div>


                    <a
                        href="admin_manage.html?formId=${encodeURIComponent(snap.id)}"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-center"
                    >
                        📊 إدارة الإجابات
                    </a>

                </li>

                `;

            }
        );


        document.getElementById(
            "formsList"
        ).innerHTML =
            html ||
            `
            <li class="text-center text-gray-400 py-6">
                لا توجد فورمات محفوظة
            </li>
            `;

    }
    catch(error) {

        console.error(error);

    }

}



// ============================================================
// START
// ============================================================

renderTempOptions();

updateQuestionsUI();

updateConditionSelects();

loadFormForEdit();

loadForms();


</script>
