<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>أدمن - إدارة الفورم</title>


    <script src="https://cdn.tailwindcss.com"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


    <style>

        body {
            font-family: Arial, Tahoma, sans-serif;
        }


        @media print {

            body {
                background: white !important;
                padding: 0 !important;
            }


            .no-print {
                display: none !important;
            }


            #printArea {
                width: 100%;
            }


            table {
                width: 100%;
                border-collapse: collapse;
            }


            thead {
                display: table-header-group;
            }


            tr {
                page-break-inside: avoid;
            }


            th,
            td {
                border: 1px solid #000 !important;
                padding: 5px !important;
                font-size: 10px !important;
            }

        }


        .answer-cell {
            min-width: 120px;
        }

    </style>

</head>


<body class="bg-gray-100 p-3 md:p-8">


<div class="max-w-7xl mx-auto bg-white p-4 md:p-8 rounded-2xl shadow-md">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div
        class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6 border-b pb-5 no-print"
    >

        <div>

            <h1
                id="formTitleDisplay"
                class="text-2xl md:text-3xl font-bold text-blue-600"
            >
                جاري التحميل...
            </h1>


            <p
                id="recordsCount"
                class="text-sm text-gray-500 mt-1"
            ></p>

        </div>


        <div
            class="flex flex-wrap gap-2"
        >

            <a
                href="admin_create.html"
                class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold"
            >
                ➕ فورم جديد
            </a>


            <button
                onclick="editQuestions()"
                class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg font-bold"
            >
                ✏️ تعديل الأسئلة
            </button>


            <button
                onclick="exportToExcel()"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold"
            >
                📊 Excel
            </button>


            <button
                onclick="exportToPDF()"
                class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold"
            >
                📄 PDF
            </button>


            <button
                onclick="window.print()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold"
            >
                🖨️ طباعة
            </button>


            <button
                onclick="deleteForm()"
                class="bg-red-800 hover:bg-red-900 text-white px-4 py-2 rounded-lg font-bold"
            >
                🗑️ حذف الفورم
            </button>

        </div>

    </div>



    <!-- =====================================================
         SETTINGS
    ====================================================== -->

    <div
        class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-5 no-print"
    >

        <label class="flex items-center gap-2 font-bold">

            <input
                type="checkbox"
                id="allowEditToggle"
                onchange="toggleEditAccess()"
                class="w-5 h-5"
            >

            السماح للطلاب بتعديل إجاباتهم

        </label>

    </div>



    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <div
        class="bg-gray-50 border rounded-xl p-4 mb-5 no-print"
    >

        <div
            class="grid grid-cols-1 md:grid-cols-4 gap-3"
        >

            <input
                type="text"
                id="searchInput"
                oninput="applyFilters()"
                placeholder="🔎 بحث في جميع البيانات..."
                class="p-3 border rounded-lg md:col-span-2"
            >


            <select
                id="searchColumn"
                onchange="applyFilters()"
                class="p-3 border rounded-lg"
            >

                <option value="">
                    جميع الأعمدة
                </option>

            </select>


            <button
                onclick="clearSearch()"
                class="bg-gray-500 hover:bg-gray-600 text-white rounded-lg font-bold"
            >
                مسح البحث
            </button>

        </div>

    </div>



    <!-- =====================================================
         PRINT AREA
    ====================================================== -->

    <div id="printArea">


        <div
            id="printTitle"
            class="hidden print:block text-center font-bold text-xl mb-4"
        ></div>


        <div class="overflow-x-auto">


            <table
                id="dataTable"
                class="w-full text-right border-collapse border"
            >

                <thead
                    id="tableHead"
                    class="bg-gray-200"
                ></thead>


                <tbody
                    id="tableBody"
                ></tbody>

            </table>


        </div>


    </div>



    <!-- =====================================================
         EDIT ANSWER MODAL
    ====================================================== -->

    <div
        id="editModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 no-print"
    >

        <div
            class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6"
        >

            <div class="flex justify-between items-center mb-5">

                <h2 class="text-xl font-bold text-blue-600">
                    ✏️ تعديل بيانات الطالب
                </h2>


                <button
                    onclick="closeEditModal()"
                    class="text-gray-500 text-2xl"
                >
                    ×
                </button>

            </div>


            <div
                id="editFields"
                class="space-y-4"
            ></div>


            <div class="flex gap-2 mt-6">

                <button
                    onclick="saveStudentEdit()"
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white p-3 rounded-lg font-bold"
                >
                    💾 حفظ
                </button>


                <button
                    onclick="closeEditModal()"
                    class="flex-1 bg-gray-500 hover:bg-gray-600 text-white p-3 rounded-lg font-bold"
                >
                    إلغاء
                </button>

            </div>

        </div>

    </div>

</div>



<script type="module">


// ============================================================
// FIREBASE
// ============================================================

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    deleteDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4",

    authDomain:
        "hazoma-60ed2.firebaseapp.com",

    projectId:
        "hazoma-60ed2",

    storageBucket:
        "hazoma-60ed2.firebasestorage.app",

    messagingSenderId:
        "962438384604",

    appId:
        "1:962438384604:web:52db16e5723a8f6d3bdd19"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);



// ============================================================
// URL
// ============================================================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const formId =
    urlParams.get("formId");



// ============================================================
// VARIABLES
// ============================================================

let formQuestions = [];

let allSubmissions = [];

let filteredSubmissions = [];

let editingSubmission = null;



// ============================================================
// ESCAPE
// ============================================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



// ============================================================
// LOAD DATA
// ============================================================

async function loadData() {

    if (!formId) {

        alert(
            "لم يتم تحديد الفورم"
        );

        return;

    }


    try {

        // ============================================
        // FORM
        // ============================================

        const formDoc =
            await getDoc(
                doc(
                    db,
                    "forms",
                    formId
                )
            );


        if (!formDoc.exists()) {

            alert(
                "الفورم غير موجود"
            );

            return;

        }


        const formData =
            formDoc.data();


        document.getElementById(
            "formTitleDisplay"
        ).innerText =
            "إدارة: " +
            (
                formData.title ||
                "بدون اسم"
            );


        document.getElementById(
            "printTitle"
        ).innerText =
            formData.title || "";


        document.getElementById(
            "allowEditToggle"
        ).checked =
            !!formData.allowEdit;


        formQuestions =
            Array.isArray(
                formData.questions
            )
            ?
            formData.questions
            :
            [];



        // ============================================
        // TABLE HEADER
        // ============================================

        let thHtml =
            `
            <tr>

                <th class="border p-2">
                    #
                </th>

                <th class="border p-2">
                    الكود التسلسلي
                </th>

                <th class="border p-2">
                    الكود المميز
                </th>
            `;


        formQuestions.forEach(
            q => {

                thHtml += `
                    <th class="border p-2">
                        ${escapeHTML(q.title)}
                    </th>
                `;

            }
        );


        thHtml += `
                <th class="border p-2 no-print">
                    إجراءات
                </th>

            </tr>
        `;


        document.getElementById(
            "tableHead"
        ).innerHTML =
            thHtml;



        // ============================================
        // SEARCH COLUMNS
        // ============================================

        const searchColumn =
            document.getElementById(
                "searchColumn"
            );


        searchColumn.innerHTML = `
            <option value="">
                جميع الأعمدة
            </option>

            <option value="serialNumber">
                الكود التسلسلي
            </option>

            <option value="uniqueId">
                الكود المميز
            </option>
        `;


        formQuestions.forEach(
            q => {

                searchColumn.innerHTML += `
                    <option value="${escapeHTML(q.id)}">
                        ${escapeHTML(q.title)}
                    </option>
                `;

            }
        );



        // ============================================
        // SUBMISSIONS
        // ============================================

        const qSnap =
            await getDocs(
                query(
                    collection(
                        db,
                        "submissions"
                    ),
                    where(
                        "formId",
                        "==",
                        formId
                    )
                )
            );


        allSubmissions = [];


        qSnap.forEach(
            snap => {

                allSubmissions.push({

                    docId:
                        snap.id,

                    ...snap.data()

                });

            }
        );


        filteredSubmissions =
            [...allSubmissions];


        renderTable();

    }
    catch(error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء تحميل البيانات: " +
            error.message
        );

    }

}



// ============================================================
// RENDER TABLE
// ============================================================

function renderTable() {

    const tbody =
        document.getElementById(
            "tableBody"
        );


    let html = "";


    filteredSubmissions.forEach(
        (data, index) => {

            html += `
                <tr class="hover:bg-gray-50">

                    <td class="border p-2">
                        ${index + 1}
                    </td>


                    <td class="border p-2">
                        ${escapeHTML(
                            data.serialNumber || "-"
                        )}
                    </td>


                    <td class="border p-2">
                        ${escapeHTML(
                            data.uniqueId || "-"
                        )}
                    </td>
            `;


            formQuestions.forEach(
                q => {

                    let value = "-";


                    if (
                        data.answers &&
                        data.answers[q.id] !== undefined &&
                        data.answers[q.id] !== null &&
                        data.answers[q.id] !== ""
                    ) {

                        value =
                            data.answers[q.id];

                    }


                    html += `
                        <td class="border p-2 answer-cell">
                            ${escapeHTML(value)}
                        </td>
                    `;

                }
            );


            html += `

                    <td class="border p-2 no-print">

                        <div class="flex gap-2">

                            <button
                                onclick="openEditModal('${escapeHTML(data.docId)}')"
                                class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded-lg"
                            >
                                ✏️
                            </button>


                            <button
                                onclick="deleteSubmission('${escapeHTML(data.docId)}')"
                                class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg"
                            >
                                🗑
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    if (!html) {

        html = `
            <tr>

                <td
                    colspan="${formQuestions.length + 4}"
                    class="text-center text-gray-400 p-8"
                >
                    لا توجد بيانات
                </td>

            </tr>
        `;

    }


    tbody.innerHTML =
        html;


    document.getElementById(
        "recordsCount"
    ).innerText =
        `عدد النتائج: ${filteredSubmissions.length} من ${allSubmissions.length}`;

}



// ============================================================
// SEARCH
// ============================================================

window.applyFilters = function() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    const column =
        document.getElementById(
            "searchColumn"
        ).value;


    if (!search) {

        filteredSubmissions =
            [...allSubmissions];

        renderTable();

        return;

    }


    filteredSubmissions =
        allSubmissions.filter(
            data => {

                if (column) {

                    let value = "";


                    if (
                        column === "serialNumber"
                    ) {

                        value =
                            data.serialNumber || "";

                    }
                    else if (
                        column === "uniqueId"
                    ) {

                        value =
                            data.uniqueId || "";

                    }
                    else {

                        value =
                            data.answers &&
                            data.answers[column]
                            ?
                            data.answers[column]
                            :
                            "";

                    }


                    return String(value)
                        .toLowerCase()
                        .includes(search);

                }


                let values = [

                    data.serialNumber || "",

                    data.uniqueId || ""

                ];


                formQuestions.forEach(
                    q => {

                        values.push(

                            data.answers &&
                            data.answers[q.id]
                            ?
                            data.answers[q.id]
                            :
                            ""

                        );

                    }
                );


                return values.some(
                    value =>
                        String(value)
                            .toLowerCase()
                            .includes(search)
                );

            }
        );


    renderTable();

};



// ============================================================
// CLEAR SEARCH
// ============================================================

window.clearSearch = function() {

    document.getElementById(
        "searchInput"
    ).value = "";


    document.getElementById(
        "searchColumn"
    ).value = "";


    filteredSubmissions =
        [...allSubmissions];


    renderTable();

};



// ============================================================
// EDIT QUESTIONS
// ============================================================

window.editQuestions = function() {

    window.location.href =
        "admin_create.html?formId=" +
        encodeURIComponent(
            formId
        );

};



// ============================================================
// TOGGLE EDIT
// ============================================================

window.toggleEditAccess = async function() {

    try {

        const allow =
            document.getElementById(
                "allowEditToggle"
            ).checked;


        await updateDoc(

            doc(
                db,
                "forms",
                formId
            ),

            {

                allowEdit:
                    allow

            }

        );


        alert(
            allow
            ?
            "تم السماح للطلاب بالتعديل ✅"
            :
            "تم منع الطلاب من التعديل ✅"
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "تعذر تحديث الصلاحية: " +
            error.message
        );

    }

};



// ============================================================
// DELETE FORM
// ============================================================

window.deleteForm = async function() {

    const first =
        confirm(
            "⚠️ هل أنت متأكد من حذف الفورم بالكامل؟"
        );


    if (!first) {

        return;

    }


    const second =
        confirm(
            "سيتم حذف الفورم نفسه. هل تريد الاستمرار؟"
        );


    if (!second) {

        return;

    }


    try {

        await deleteDoc(
            doc(
                db,
                "forms",
                formId
            )
        );


        /*
            نحذف submissions التابعة للفورم
        */

        const qSnap =
            await getDocs(
                query(
                    collection(
                        db,
                        "submissions"
                    ),
                    where(
                        "formId",
                        "==",
                        formId
                    )
                )
            );


        for (
            const snap
            of qSnap.docs
        ) {

            await deleteDoc(
                doc(
                    db,
                    "submissions",
                    snap.id
                )
            );

        }


        alert(
            "تم حذف الفورم وبياناته بنجاح ✅"
        );


        window.location.href =
            "admin_create.html";

    }
    catch(error) {

        console.error(error);

        alert(
            "تعذر حذف الفورم: " +
            error.message
        );

    }

};



// ============================================================
// OPEN EDIT MODAL
// ============================================================

window.openEditModal = function(docId) {

    const data =
        allSubmissions.find(
            item =>
                item.docId === docId
        );


    if (!data) {

        alert(
            "البيانات غير موجودة"
        );

        return;

    }


    editingSubmission = data;


    let html = "";


    formQuestions.forEach(
        q => {

            const value =
                data.answers &&
                data.answers[q.id] !== undefined
                ?
                data.answers[q.id]
                :
                "";


            if (
                q.type === "select"
            ) {

                html += `

                    <div>

                        <label class="block font-bold mb-2">
                            ${escapeHTML(q.title)}
                        </label>

                        <select
                            id="edit_${escapeHTML(q.id)}"
                            class="w-full p-3 border rounded-lg"
                        >

                            <option value="">
                                اختر
                            </option>

                            ${
                                (q.options || [])
                                .map(
                                    option => {

                                        const text =
                                            typeof option === "string"
                                            ?
                                            option
                                            :
                                            option.text;


                                        return `

                                        <option
                                            value="${escapeHTML(text)}"
                                            ${
                                                String(value) ===
                                                String(text)
                                                ?
                                                "selected"
                                                :
                                                ""
                                            }
                                        >
                                            ${escapeHTML(text)}
                                        </option>

                                        `;

                                    }
                                )
                                .join("")
                            }

                        </select>

                    </div>

                `;

            }
            else {

                html += `

                    <div>

                        <label class="block font-bold mb-2">
                            ${escapeHTML(q.title)}
                        </label>

                        <input
                            type="${q.type === "date" ? "date" : "text"}"
                            id="edit_${escapeHTML(q.id)}"
                            value="${escapeHTML(value)}"
                            class="w-full p-3 border rounded-lg"
                        >

                    </div>

                `;

            }

        }
    );


    document.getElementById(
        "editFields"
    ).innerHTML =
        html;


    document.getElementById(
        "editModal"
    ).classList.remove(
        "hidden"
    );

};



// ============================================================
// CLOSE MODAL
// ============================================================

window.closeEditModal = function() {

    editingSubmission = null;


    document.getElementById(
        "editModal"
    ).classList.add(
        "hidden"
    );

};



// ============================================================
// SAVE STUDENT EDIT
// ============================================================

window.saveStudentEdit = async function() {

    if (!editingSubmission) {

        return;

    }


    try {

        const answers = {};


        formQuestions.forEach(
            q => {

                const input =
                    document.getElementById(
                        "edit_" + q.id
                    );


                if (input) {

                    answers[q.id] =
                        input.value;

                }

            }
        );


        await updateDoc(

            doc(
                db,
                "submissions",
                editingSubmission.docId
            ),

            {

                answers:
                    answers

            }

        );


        /*
            تحديث البيانات محلياً
        */

        const index =
            allSubmissions.findIndex(
                item =>
                    item.docId ===
                    editingSubmission.docId
            );


        if (index >= 0) {

            allSubmissions[index].answers =
                answers;

        }


        filteredSubmissions =
            [...allSubmissions];


        renderTable();


        closeEditModal();


        alert(
            "تم تعديل بيانات الطالب بنجاح ✅"
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "تعذر حفظ التعديل: " +
            error.message
        );

    }

};



// ============================================================
// DELETE SUBMISSION
// ============================================================

window.deleteSubmission = async function(docId) {

    if (
        !confirm(
            "هل تريد حذف بيانات هذا الطالب؟"
        )
    ) {

        return;

    }


    try {

        await deleteDoc(
            doc(
                db,
                "submissions",
                docId
            )
        );


        allSubmissions =
            allSubmissions.filter(
                item =>
                    item.docId !== docId
            );


        filteredSubmissions =
            filteredSubmissions.filter(
                item =>
                    item.docId !== docId
            );


        renderTable();


        alert(
            "تم حذف البيانات ✅"
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "تعذر حذف البيانات: " +
            error.message
        );

    }

};



// ============================================================
// EXPORT EXCEL
// ============================================================

window.exportToExcel = function() {

    const table =
        document.getElementById(
            "dataTable"
        );


    /*
        نسخة بدون عمود الإجراءات
    */

    const clone =
        table.cloneNode(true);


    clone
        .querySelectorAll(
            ".no-print"
        )
        .forEach(
            element =>
                element.remove()
        );


    const wb =
        XLSX.utils.table_to_book(
            clone,
            {
                sheet:
                    "البيانات"
            }
        );


    XLSX.writeFile(
        wb,
        "بيانات_الطلاب.xlsx"
    );

};



// ============================================================
// PDF
// ============================================================

window.exportToPDF = async function() {

    const printArea =
        document.getElementById(
            "printArea"
        );


    const clone =
        printArea.cloneNode(true);


    clone
        .querySelectorAll(
            ".no-print"
        )
        .forEach(
            element =>
                element.remove()
        );


    clone.style.background =
        "#ffffff";


    clone.style.padding =
        "10px";


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.style.background =
        "#ffffff";


    wrapper.style.direction =
        "rtl";


    wrapper.appendChild(
        clone
    );


    document.body.appendChild(
        wrapper
    );


    try {

        await html2pdf()
            .set({

                margin:
                    [10, 8, 10, 8],
